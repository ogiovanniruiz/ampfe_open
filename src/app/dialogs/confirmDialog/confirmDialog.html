<div class="ge-header">
  <h2 mat-dialog-title class="ge-title">{{data.title}}</h2>
</div>
<mat-dialog-content *ngIf="data.message">
  <p class="ge-help">{{data.message}}</p>
</mat-dialog-content>
<mat-dialog-actions class="ge-actions">
  <span class="spacer"></span>
  <button mat-button [mat-dialog-close]="false">{{data.cancelLabel || 'Keep editing'}}</button>
  <button mat-raised-button [color]="data.danger ? 'warn' : 'primary'" [mat-dialog-close]="true">{{data.confirmLabel || 'Discard'}}</button>
</mat-dialog-actions>
