<button mat-icon-button class="close-button" matTooltip="Cancel"  (click)="return();"><mat-icon>close</mat-icon></button>

<h1 mat-dialog-title class="block-title"><b>Incidents</b></h1>
<mat-dialog-content >
    <table style=" margin:auto;" mat-table [dataSource]="incidents" class="mat-elevation-z8">
              
        <ng-container matColumnDef="categories">
          <th mat-header-cell *matHeaderCellDef> CATEGORIES </th>
          <td mat-cell *matCellDef="let element"> {{element.categories}} </td>
        </ng-container>
      
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef> STATUS </th>
          <td mat-cell *matCellDef="let element"> {{element.status}} </td>
        </ng-container>

        <ng-container matColumnDef="severity">
          <th mat-header-cell *matHeaderCellDef> SEVERITY </th>
          <td mat-cell *matCellDef="let element"> {{element.severity}} </td>
        </ng-container>

        <ng-container matColumnDef="active">
          <th mat-header-cell *matHeaderCellDef> ACTIVE </th>
          <td mat-cell *matCellDef="let element"> {{element.active}} </td>
        </ng-container>
      
        <ng-container matColumnDef="created_by">
          <th mat-header-cell *matHeaderCellDef> CREATED BY </th>
          <td mat-cell *matCellDef="let element"> {{element.user.name.firstName}} {{element.user.name.lastName}} </td>
        </ng-container>
      
        <ng-container matColumnDef="location">
          <th mat-header-cell *matHeaderCellDef> LOCATION </th>
          <td mat-cell *matCellDef="let element"> {{element.address.address}} </td>
        </ng-container>

        <ng-container matColumnDef="created_on">
          <th mat-header-cell *matHeaderCellDef> CREATED ON </th>
          <td mat-cell *matCellDef="let element"> {{element.date_created}} </td>
        </ng-container>
        <ng-container matColumnDef="edit">
          <th mat-header-cell *matHeaderCellDef> EDIT </th>
          <td mat-cell *matCellDef="let element"> <button mat-icon-button (click)="openEditIncidentDialog(element)" ><mat-icon>edit</mat-icon></button> </td>
        </ng-container>
        <ng-container matColumnDef="delete">
          <th mat-header-cell *matHeaderCellDef> DELETE </th>
          <td mat-cell *matCellDef="let element"> <button mat-icon-button color="warn" [disabled]='!dev' (click)="deleteIncident(element._id)"><mat-icon>delete</mat-icon></button> </td>

        </ng-container>
      
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

</mat-dialog-content>
<mat-dialog-actions  >
  <button mat-raised-button class="dialog-element-long" color="primary" (click)="exportIncidents()">Export</button>
</mat-dialog-actions>
