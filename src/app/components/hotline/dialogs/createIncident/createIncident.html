<button mat-icon-button class="close-button" matTooltip="Cancel"  (click)="return();"><mat-icon>close</mat-icon></button>

<h1 mat-dialog-title class="block-title"><b>Create An Incident</b></h1>
<mat-progress-bar mode="indeterminate" *ngIf="loading"></mat-progress-bar>

<mat-dialog-content>
    <mat-form-field  style="margin:.3em; width:30%; min-width:300px"> 
        <mat-label>Categories</mat-label>
        <mat-select #categories multiple>
            <mat-option value="ICE_ALERT" >ICE ALERT</mat-option>
            <mat-option value="DHS_ALERT" >DHS ALERT</mat-option>
            <mat-option value="SHERIFF_ALERT" >SHERIFF ALERT</mat-option>
            <mat-option value="OTHER_LAW_ENFORCEMENT" >OTHER LAW ENFORCEMENT</mat-option>

        </mat-select>
    </mat-form-field>
    <mat-form-field style="margin:.3em; width:30%; min-width:300px"> 
        <mat-label>Status</mat-label>
        <mat-select #status >
            <mat-option value="confirmed" >Confirmed</mat-option>
            <mat-option value="unconfirmed" >Unconfirmed</mat-option>
        </mat-select>
    </mat-form-field >
    <mat-form-field style="margin:.3em; width:30%; min-width:300px"> 
        <mat-select placeholder="Severity" #severity >
            <mat-option value="3" >Red (Arrests In Progress)</mat-option>
            <mat-option value="2" >Orange (Threats of Arrest)</mat-option>
            <mat-option value="1" >Yellow (Law Enforcement Presence)</mat-option>
        </mat-select>
    </mat-form-field >

    <mat-card >
        <mat-form-field class="dialog-element-long"> 
            <!--<input matInput #address type="text" placeholder="Address">-->
            <input type="text" matInput #address placeholder="Address Line 1" autocomplete="off" [matAutocomplete]="addressAuto" (input)="onAddressInput(address.value)" />
            <mat-autocomplete #addressAuto="matAutocomplete" [displayWith]="displaySuggestion" (optionSelected)="pickAddress($event.option.value)">
                <mat-option *ngFor="let suggestion of addressSuggestions" [value]="suggestion">{{suggestion.text}}</mat-option>
            </mat-autocomplete>

        </mat-form-field >
        <mat-form-field class="dialog-element-long"> 
            <input matInput #address2 type="text" placeholder="Address Line 2 (Optional)">
        </mat-form-field >
        <mat-form-field style="margin:.3em;width:30%;min-width:300px"> 
            <input matInput #city type="text" id="city" placeholder="City">
        </mat-form-field >
        <mat-form-field style="margin:.3em;width:20%;min-width:300px"> 
            <mat-select placeholder="State" #state >
                <mat-option value="CA" selected="true">CA</mat-option>
            </mat-select>
        </mat-form-field >
        <mat-form-field style="margin:.3em;width:30%;min-width:300px"> 
            <input matInput #zip type="text" id="zip" placeholder="Zip">
        </mat-form-field >
    </mat-card>


    <mat-form-field class="dialog-element-long">
        <textarea  matInput placeholder="Report" #report maxlength="1000"></textarea>
    </mat-form-field>

    <mat-error *ngIf="displayMessage">{{userMessage}}</mat-error>

</mat-dialog-content>
<mat-dialog-actions  >
    <button mat-raised-button (click)='createIncident()'class="dialog-element-long" color="primary">SAVE</button>
</mat-dialog-actions>
