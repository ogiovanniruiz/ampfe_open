<div class="sd-header">
  <h2 mat-dialog-title class="sd-title">Find an address</h2>
  <span class="spacer"></span>
  <button mat-icon-button matTooltip="Close" (click)="cancel()"><mat-icon>close</mat-icon></button>
</div>
<p class="sd-hint">Drops a pin on the map at the address you enter.</p>

<mat-dialog-content class="sd-content">
  <mat-form-field appearance="outline" class="sd-field">
    <mat-label>Full address</mat-label>
    <mat-icon matPrefix>place</mat-icon>
    <input matInput [(ngModel)]="fullAddress" placeholder="123 Main St, Riverside, CA" autocomplete="off" (keyup.enter)="geocodeAddress()">
  </mat-form-field>

  <div class="sd-banner" *ngIf="errorMessage">
    <mat-icon>error_outline</mat-icon>
    <span>{{errorMessage}}</span>
  </div>
</mat-dialog-content>

<mat-dialog-actions class="sd-actions" align="end">
  <span class="spacer"></span>
  <button mat-raised-button color="primary" [disabled]="searching" (click)="geocodeAddress()">
    <mat-spinner *ngIf="searching" diameter="16" class="sd-button-spinner"></mat-spinner>
    <mat-icon *ngIf="!searching">search</mat-icon> Search
  </button>
</mat-dialog-actions>
